name: Publish verified public project update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-source-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release archive and source baseline
        run: |
          base64 --decode public-update.zip.b64 > public-update.zip
          echo '6f2cb0a837e7d82527c6796b3f17a63b93ecc8517511807dfbf7fe55ecf1b9b9  public-update.zip' | sha256sum --check --strict
          git merge-base --is-ancestor 2069890e816711f20cbf80b6e58c427f5bfacbb5 HEAD
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          allowed = set(['README.md', 'asset-files.mjs', 'scripts/build.mjs', 'scripts/verify-cloudflare.mjs', 'dist/index.html', 'dist/app.css', 'package.json', 'CHANGELOG.md', 'CONTRIBUTING.md', 'SECURITY.md', 'dist/updates.json', 'dist/updates.js', 'scripts/release-notes.mjs', 'scripts/update-changelog.mjs', 'scripts/verify-release.mjs', 'scripts/verify-announcements.mjs', 'scripts/publish-github-release.mjs', 'scripts/audit-public-history.py'])
          with zipfile.ZipFile('public-update.zip') as archive:
              entries = archive.infolist()
              if len(entries) != 19 or len({entry.filename for entry in entries}) != 19:
                  raise ValueError('Unexpected release entry count')
              if sum(entry.file_size for entry in entries) > 8000000:
                  raise ValueError('Release too large')
              manifest = json.loads(archive.read('.deploy-manifest.json'))
              files = manifest['files']
              if len(files) != 18 or {item['path'] for item in files} != allowed:
                  raise ValueError('Unexpected source paths')
              if {entry.filename for entry in entries} != allowed | {'.deploy-manifest.json'}:
                  raise ValueError('Unexpected archive paths')
              contents = {}
              for item in files:
                  path = pathlib.PurePosixPath(item['path'])
                  if path.is_absolute() or '..' in path.parts or '\\' in str(path):
                      raise ValueError('Unsafe source path')
                  target = (root / str(path)).resolve()
                  if root not in target.parents or target.is_symlink():
                      raise ValueError('Source outside checkout')
                  content = archive.read(str(path))
                  if hashlib.sha256(content).hexdigest() != item['sha256']:
                      raise ValueError('Changed release content: ' + str(path))
                  prior = hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
                  if prior != item['baseSha256']:
                      raise ValueError('Remote source changed; merge before release: ' + str(path))
                  contents[target] = content
              for target, content in contents.items():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
          pathlib.Path('.release-paths.json').write_text(json.dumps(sorted(allowed)))
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate catalog, existing features and new game rules
        run: |
          node scripts/run-checks.mjs
          node scripts/build.mjs
          node scripts/verify-cloudflare.mjs
          node scripts/verify-games.mjs
          node scripts/verify-undercover.mjs
          node scripts/verify-release.mjs
          node scripts/verify-announcements.mjs
          python3 scripts/audit-public-history.py
      - name: Publish verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('.release-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git rm public-update.zip.b64
          git commit -m 'Add project links, versioned announcements and public repository documentation'
          git push origin HEAD:main
