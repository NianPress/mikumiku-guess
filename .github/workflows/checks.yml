name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify existing game features
        run: node scripts/run-checks.mjs
      - name: Verify free Cloudflare build
        run: |
          node scripts/build.mjs
          node scripts/verify-cloudflare.mjs
          node scripts/verify-games.mjs
